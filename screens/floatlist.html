<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloatList</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #17202a;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
    }
    .app { width: min(680px, 100%); }
    h1 { margin: 0 0 8px; font-size: 34px; }
    .subtitle { margin: 0 0 28px; color: #68727d; }
    .panel {
      background: white;
      border: 1px solid #e1e5e9;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(20, 30, 40, .06);
    }
    form { display: flex; gap: 10px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #cfd6dd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #7d8791; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: 700;
      cursor: pointer;
      background: #17202a;
      color: white;
    }
    button:hover { opacity: .9; }
    ul { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 10px; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid #e1e5e9;
      border-radius: 12px;
      background: #fafbfc;
    }
    .remove {
      background: transparent;
      color: #68727d;
      padding: 6px 8px;
      font-size: 13px;
    }
    .empty { color: #8a949e; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>FloatList</h1>
    <p class="subtitle">Adicione e gerencie nomes rapidamente.</p>

    <section class="panel">
      <form id="nameForm">
        <input id="nameInput" type="text" maxlength="80" placeholder="Digite um nome..." autocomplete="off" required>
        <button type="submit">Adicionar</button>
      </form>

      <ul id="nameList" aria-live="polite"></ul>
    </section>
  </main>

  <script>
    const form = document.querySelector("#nameForm");
    const input = document.querySelector("#nameInput");
    const list = document.querySelector("#nameList");

    let names = JSON.parse(localStorage.getItem("floatlist-names") || "[]");

    function save() {
      localStorage.setItem("floatlist-names", JSON.stringify(names));
    }

    function render() {
      list.innerHTML = "";

      if (!names.length) {
        list.innerHTML = '<li class="empty">Nenhum nome adicionado ainda.</li>';
        return;
      }

      names.forEach((name, index) => {
        const item = document.createElement("li");
        item.innerHTML = `<span></span><button class="remove" type="button">Remover</button>`;
        item.querySelector("span").textContent = name;
        item.querySelector(".remove").addEventListener("click", () => {
          names.splice(index, 1);
          save();
          render();
        });
        list.appendChild(item);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (!name) return;

      names.push(name);
      save();
      render();
      input.value = "";
      input.focus();
    });

    render();
  </script>
</body>
</html>
